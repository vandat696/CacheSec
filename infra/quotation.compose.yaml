name: cachesec-quotation-dev

services:
  quotation:
    # Only the registered baseline runtime; no candidate or working-tree source mounts.
    image: ${CACHESEC_QUOTATION_RUNTIME_IMAGE:?Run scripts/start-local.ps1}
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - path: ${CACHESEC_ROOT:?Run scripts/start-local.ps1}/backend/.local/quotation-runtime.env
        format: raw
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - database
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, urllib.error; exec(\"try:\\n urllib.request.urlopen('http://127.0.0.1:8001/api/v1/quotations', timeout=2)\\nexcept urllib.error.HTTPError as e:\\n raise SystemExit(0 if e.code == 401 else 1)\")"
      interval: 3s
      timeout: 4s
      retries: 10

networks:
  database:
    external: true
    name: cachesec_default
